[hooks]
post-create = """
#!/bin/bash
set -e

DB_NAME="myapp_{{ .Branch | strings.SnakeCase }}"
APP_URL="myapp_{{ .Branch | strings.Slug }}"

echo "Cloning database: myapp_db_base -> $DB_NAME"
mysql -uroot -e "CREATE DATABASE IF NOT EXISTS \`$DB_NAME\`;" 2>/dev/null || true
mysqldump -uroot myapp_db_base 2>/dev/null | mysql -uroot "$DB_NAME" 2>/dev/null || {
  echo "Warning: Could not clone database. Creating empty database instead."
  mysql -uroot -e "CREATE DATABASE IF NOT EXISTS \`$DB_NAME\`;" 2>/dev/null
}

echo "Installing Composer dependencies..."
composer install --quiet --no-interaction

echo "Installing NPM dependencies..."
npm install --silent

echo "Linking to Laravel Herd..."
herd link

echo "Worktree setup complete!"
echo "App URL: http://$APP_URL.myapp.test"
echo "Database: $DB_NAME"
"""

pre-delete = """
#!/bin/bash
set -e

DB_NAME="myapp_{{ .Branch | strings.SnakeCase }}"

echo "Deleting database: $DB_NAME"
mysql -uroot -e "DROP DATABASE IF EXISTS \`$DB_NAME\`;" 2>/dev/null || {
  echo "Warning: Could not delete database $DB_NAME"
}

echo "Unlinking from Laravel Herd..."
cd "{{ .Directory }}" && herd unlink 2>/dev/null || true

echo "Worktree cleanup complete!"
"""

[files]
".env" = { template = ".wtm/env.tmpl" }

[vars]
db_host = "127.0.0.1"
db_port = "3306"
